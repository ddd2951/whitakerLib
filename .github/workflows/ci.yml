name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.sanitize == 'ON' && 'sanitizers' || 'release' }}
    runs-on: ubuntu-24.04
    # #embed needs GCC 15 or Clang 19, newer than Ubuntu 24.04's own.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            image: gcc:15
            packages: cmake
            cc: gcc
            cxx: g++
            sanitize: "OFF"
          - compiler: clang
            image: debian:trixie
            packages: cmake make clang g++
            cc: clang
            cxx: clang++
            sanitize: "OFF"
          - compiler: gcc
            image: gcc:15
            packages: cmake
            cc: gcc
            cxx: g++
            sanitize: "ON"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: >
          apt-get update &&
          apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Verify the vendored sources
        run: sha256sum -c MANIFEST.sha256
        working-directory: data/source

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DWHITAKER_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/prefix"

      - name: Exported symbols
        if: matrix.sanitize == 'OFF'
        run: |
          nm -D --defined-only prefix/lib/libwhitaker.so | awk '$2 == "T" {print $3}' | sed 's/@@.*//' | sort > exported.txt
          printf 'whitaker_addon_meaning\nwhitaker_addon_spelling\nwhitaker_analyze\nwhitaker_describe\nwhitaker_init\nwhitaker_name\nwhitaker_result_copy\n' | diff - exported.txt
