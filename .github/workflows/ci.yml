name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.sanitize == 'ON' && 'sanitizers' || 'release' }}
    runs-on: ubuntu-24.04
    # #embed needs GCC 15 or Clang 20, newer than Ubuntu 24.04's own.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            image: gcc:15
            packages: cmake
            cxx: g++
            sanitize: "OFF"
          - compiler: clang
            image: ubuntu:26.04
            packages: cmake make clang-20 g++
            cxx: clang++-20
            sanitize: "OFF"
          - compiler: gcc
            image: gcc:15
            packages: cmake
            cxx: g++
            sanitize: "ON"
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: >
          apt-get update &&
          apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DWHITAKER_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j2

      - name: Install
        run: cmake --install build --prefix "$PWD/prefix"

      - name: Build the examples against the install
        run: >
          cmake -S examples -B build-examples -DCMAKE_PREFIX_PATH="$PWD/prefix" &&
          cmake --build build-examples -j2
