<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="mwW0t8Fin87UO8lgWMw-o3o-J2uY7tJmjcDx9BCPxG8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self';
               img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>whitakerLib inspector: Latin readings, API and lookup trace</title>
<meta name="description"
      content="The test page for whitakerLib, a C++ Latin library: paste Latin and inspect every reading, the API output in C++, C and Python, and the lookup trace.">
<link rel="canonical" href="https://ddd2951.github.io/whitakerLib/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ddd2951.github.io/whitakerLib/">
<meta property="og:title" content="whitakerLib inspector: Latin readings, API and lookup trace">
<meta property="og:description" content="Paste Latin and inspect what whitakerLib returns: every reading, the API output in C++, C and Python, and the lookup trace.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<main id="main">
  <section id="text-pane">
    <div id="entry">
      <textarea id="source" rows="1" spellcheck="false" disabled
                placeholder="Loading the dictionary …"></textarea>
    </div>
    <div id="passage"></div>
    <div id="highlights"></div>
    <div id="search-bar">
      <input id="search" type="search" spellcheck="false" autocomplete="off"
             placeholder="search">
      <span id="search-count"></span>
      <button id="search-prev">↑</button>
      <button id="search-next">↓</button>
      <button id="select-all">Select all</button>
      <label class="open">Open .txt<input type="file"
             id="open-file" accept=".txt,text/plain" multiple hidden></label>
    </div>
  </section>

  <section id="inspector">
    <h2 id="word"></h2>
    <div id="view"></div>
    <nav id="views">
      <button data-view="readable">Readings</button>
      <button data-view="sentence">Sentence (experimental)</button>
      <button data-view="api">API</button>
      <button data-view="trace">Trace</button>
      <button data-view="statistics">Statistics</button>
      <button id="ask">Copy word for Google help</button>
      <a class="open" href="https://addons.mozilla.org/firefox/addon/offline-latin-dictionary/" target="_blank" rel="noopener">Get the Firefox extension</a>
    </nav>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
