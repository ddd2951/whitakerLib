<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self';
               img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>whitakerLib inspector</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<main id="main">
  <section id="text-pane">
    <div id="entry">
      <textarea id="source" rows="1" spellcheck="false" disabled
                placeholder="Loading the dictionary …"></textarea>
    </div>
    <div id="passage"></div>
    <div id="highlights"></div>
    <div id="search-bar">
      <input id="search" type="search" spellcheck="false" autocomplete="off"
             placeholder="search">
      <span id="search-count"></span>
      <button id="search-prev">↑</button>
      <button id="search-next">↓</button>
      <button id="select-all">Select all</button>
      <label class="open">Open .txt<input type="file"
             id="open-file" accept=".txt,text/plain" multiple hidden></label>
    </div>
  </section>

  <section id="inspector">
    <h2 id="word"></h2>
    <div id="view"></div>
    <nav id="views">
      <button data-view="readable">Readings</button>
      <button data-view="sentence">Sentence (experimental)</button>
      <button data-view="api">API</button>
      <button data-view="trace">Trace</button>
      <button data-view="statistics">Statistics</button>
      <button id="ask">Copy word for Google help</button>
    </nav>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
